name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Новый пуш в ту же ветку отменяет предыдущий прогон — очередь не копится.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Линтер и формат
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Установка ruff
        run: pip install ruff

      - name: Проверка правил
        run: ruff check . --output-format github

      - name: Проверка форматирования
        run: ruff format --check .

  fixtures:
    name: Фикстуры без следов сессии
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Фикстуры снимаются с живой витрины и содержат трекинговые токены сессии
      # браузера. Один раз их уже пришлось вычищать вручную перед публикацией —
      # эта проверка не даёт истории повториться.
      - name: Проверка фикстур
        run: python scripts/check_fixtures.py

  test:
    name: Тесты (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Установка пакета
        run: pip install -e ".[dev]"

      # Браузер в CI не нужен: тесты работают на сохранённом ответе витрины
      # и в сеть не ходят. Живые прогоны делаются вручную на машине клиента.
      - name: Тесты
        run: pytest -q
