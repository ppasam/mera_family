# Список желаний клиента — образец со всеми полями.
#
# Рабочий файл называется wishlist.yaml и лежит рядом. Он не попадает в git:
# это личные данные. Скопируйте образец и правьте под себя:
#
#     cp config/wishlist.example.yaml config/wishlist.yaml
#
# Файл читается заново при каждом запуске — перезапускать ничего не нужно.

items:

  # ── Короткая форма ───────────────────────────────────────────────────────
  # Просто строка: модуль ищет ровно её и берёт три лучших предложения.
  # Годится, когда товар опознаётся по названию однозначно.

  - "магний глицинат"

  # ── Развёрнутая форма ────────────────────────────────────────────────────
  # Словарь с уточнениями. Обязательное поле здесь одно — query, остальные
  # добавляются по мере надобности.

  - query: "омега 3 solgar"          # ОБЯЗАТЕЛЬНО. Что вводить в поиск витрины

    # ── Поля, которые работают сейчас ────────────────────────────────────

    must_include: [solgar]           # Слова, обязательные в названии предложения.
                                     # Сравнение буквальное и без учёта регистра:
                                     # «solgar» отсечёт товары, подписанные
                                     # кириллицей как «Солгар». Это инструмент
                                     # точности, а не удобства — если нужны оба
                                     # написания, поле лучше не задавать.

    must_exclude:                    # Слова-отсекатели. Срабатывает любое из них.
      - "для детей"                  # Самое полезное поле списка: витрина охотно
      - "жевательн"                  # подмешивает детские и жевательные формы.
      - "kids"                       # Пишите корень слова, а не точную форму.

    max_price: 6000                  # Потолок цены за единицу, ₽. Сравнивается
                                     # с той ценой, которую заплатит клиент —
                                     # то есть с ценой по карте, если она есть.

    # ── Поля на будущее: сохраняются, но на отбор пока не влияют ─────────

    brand: Solgar                    # Ожидаемый бренд. Сейчас справочная пометка;
                                     # роль фильтра выполняет must_include.

    synonyms:                        # Альтернативные написания. Задумывались для
      - "Solgar Omega-3"             # расширения поиска, в отборе не участвуют.
      - "Solgar Triple Strength Omega-3"

    quantity: 1                      # Сколько штук нужно. Покупка пока всегда
                                     # кладёт в корзину одну.

    marketplaces: [ozon]             # Где искать. Ozon пока единственная площадка,
                                     # для которой написан адаптер.

    note: "Triple Strength 950 мг, банка от 100 капсул"   # Заметка для себя.
                                     # Модуль её не читает, но она остаётся
                                     # рядом с товаром и видна при правке файла.
