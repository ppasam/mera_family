[project]
name = "wishlist-buyer"
version = "0.1.0"
description = "Поиск и закупка товаров из списка желаний клиента на маркетплейсах"
requires-python = ">=3.12"
dependencies = [
    "patchright>=1.49",      # Playwright без CDP-артефактов автоматизации
    "curl-cffi>=0.7",        # быстрые запросы с TLS-отпечатком Chrome на готовых куках
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.15",
    "rich>=13.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[project.scripts]
wishlist = "wishlist_buyer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wishlist_buyer"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # сортировка импортов
    "UP",       # устаревшие конструкции
    "B",        # типичные ошибки (bugbear)
    "SIM",      # упрощения
    "RUF",      # правила самого ruff, включая кириллицу в строках
]
ignore = [
    "RUF001",   # кириллица в строках — здесь это язык интерфейса, а не опечатка
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]  # sys.path правится до импортов пакета — иначе его не видно

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
